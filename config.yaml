# 华为伙伴营销内容协作平台 - 配置
# 管理员可在后台修改此配置

brand:
  name: "华为坤灵"
  slogan: "遥遥领先"
  tone: ["专业", "亲切", "高端", "科技感"]

products:
  - id: "df10"
    name: "ekitEngine DF10"
    keywords: ["ekitEngine", "DF10", "防偷拍", "隐藏影像检测"]
    directions:
      - id: "product_showcase"
        name: "产品种草"
        prompt_hint: "突出产品核心卖点和使用场景"
        output_types: ["文案+配图", "短视频", "脚本"]
      - id: "activity"
        name: "活动推广"
        prompt_hint: "结合促销/节日/活动节点"
        output_types: ["文案+配图", "短视频", "脚本"]
      - id: "scene_story"
        name: "场景故事"
        prompt_hint: "结合真实使用场景讲故事"
        output_types: ["文案+配图", "短视频", "脚本"]
      - id: "user_case"
        name: "客户案例"
        prompt_hint: "以客户视角讲述使用体验"
        output_types: ["文案+配图", "短视频", "脚本"]

rules:
  forbidden_words:
    - "最"  # 极限词谨慎使用
    - "第一"
    - "绝对"
  required_words:
    - "华为坤灵"
  brand_phrases:
    - "华为坤灵 %s"
    - "华为坤灵"

review:
  # 审核通过后的内容是否自动标记为"可供所有伙伴使用"
  auto_share_materials: true
